name: Validate website sidebar navigation

on:
  push:
    paths:
      - '*.html'
      - 'scripts/check_navigation.py'
      - 'images/gallery/**'
      - 'assets/css/site-overrides.css'
      - 'assets/js/theme.js'
      - 'assets/js/gallery.js'
      - 'scripts/test_gallery.js'
      - 'scripts/test_theme.js'
      - '.github/workflows/check-navigation.yml'
  pull_request:
    paths:
      - '*.html'
      - 'scripts/check_navigation.py'
      - 'images/gallery/**'
      - 'assets/css/site-overrides.css'
      - 'assets/js/theme.js'
      - 'assets/js/gallery.js'
      - 'scripts/test_gallery.js'
      - 'scripts/test_theme.js'
      - '.github/workflows/check-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidebar-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Verify sidebar consistency and links
        run: python3 scripts/check_navigation.py
      - name: Check theme JavaScript syntax
        run: node --check assets/js/theme.js
      - name: Test OS appearance and theme toggling
        run: node scripts/test_theme.js
      - name: Validate Gallery script syntax
        run: node --check assets/js/gallery.js
      - name: Test Gallery live updates and fallback
        run: node scripts/test_gallery.js
